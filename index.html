<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anniversaires">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Anniversaires – Caisse Populaire SUCCÈS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400&display=swap">
<style>
:root{--g1:#1b5e20;--g2:#2d7d1f;--g3:#7dba48;--bg:#eef3ea;--ink:#1f3a14;--mut:#5f7355;--line:#d3dfca;--gold:#f0c919;--red:#b3261e}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid #b9c9ae;border-radius:10px;background:#fff;font-size:1rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--g2);color:#fff;font-size:.9rem;white-space:nowrap}
.btn.alt{background:#fff;color:var(--g1);border:1px solid var(--line)}
.btn.del{background:#fff;color:var(--red);border:1px solid #efc9c6}
.btn.sm{padding:7px 10px;font-size:.8rem}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600}

/* Logo / notifications */
.logobtn{background:#fff;border:0;border-radius:50%;width:46px;height:46px;padding:2px;cursor:pointer;flex:none;position:relative}
.logoimg{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.logobtn::after{content:'✎';position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#5a3a00;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.hr{display:flex;gap:8px;align-items:center}
.bell{position:relative;font-size:1.1rem;padding:7px 11px}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;font-size:.65rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.banner{background:var(--gold);color:#4a3200;border-radius:12px;padding:10px 12px;font-size:.9rem;font-weight:600;margin-bottom:12px}
.nlist{display:grid;gap:8px}
.nit{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.nit img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#ddd}
.nit.today{background:#fff8d6;border-color:var(--gold)}
.lp{width:120px;height:120px;margin:0 auto;border:1px dashed #b9c9ae;border-radius:12px;padding:6px;background:#f6f9f3}
.lp img{width:100%;height:100%;object-fit:contain}
.llogo{width:72px;height:72px;margin:0 auto}
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(170deg,#93d765,#58953a 60%,#3f7a2b)}
.lbox{background:#fff;width:100%;max-width:380px;border-radius:18px;padding:26px 22px;display:grid;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.lbox h1{font-size:1.25rem;line-height:1.2}.lbox h1 b{color:#0a7a1e;font-weight:800;display:block;font-size:1.7rem}
.err{color:var(--red);font-size:.85rem;min-height:1.1em}

/* App */
header{background:var(--g1);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1rem;line-height:1.15}header h1 b{font-weight:800;display:block;font-size:1.15rem}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.tools{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.tools .s{grid-column:1/-1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:.8rem;color:var(--mut)}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.list{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center}
.item img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#ddd}
.nm{font-weight:600;line-height:1.2}.nm small{display:block;font-weight:400;color:var(--mut);font-size:.8rem;margin-top:2px}
.dt{font-size:.8rem;color:var(--mut);margin-top:3px}
.badge{display:inline-block;background:var(--gold);color:#5a3a00;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:600;margin-left:6px}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:14px 18px;border-radius:99px}

/* Modales */
.modal{position:fixed;inset:0;background:rgba(10,25,5,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:12px;max-height:100vh;overflow:auto}
.sheet h2{font-size:1.1rem}
.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.pv{display:flex;gap:12px;align-items:center}.pv img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#ddd}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}.item{grid-template-columns:56px 1fr auto}.acts{grid-column:auto}.tools{grid-template-columns:2fr 1fr 1fr}.tools .s{grid-column:auto}}

/* Carte */
#card{container-type:inline-size;position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;color:#fff;
 background:radial-gradient(ellipse 60% 25% at 20% 18%,rgba(190,240,130,.55),transparent 70%),linear-gradient(170deg,#93d765 0%,#7dba48 22%,#6aa63d 50%,#58953a 78%,#468330 100%)}
#card>*{position:absolute}
#card .decor{inset:0;width:100%;height:100%}
.t{white-space:nowrap;line-height:1}
#t1{left:19.2%;top:5.1%;font-size:4.35cqw}
#t2{left:19.2%;top:9.1%;font-size:6.2cqw;font-weight:800;color:#0a7a1e}
#joyeux{left:60.5%;top:17.4%;font-size:7.3cqw;font-weight:700}
#anniv{left:51.5%;top:26.1%;font-size:6.5cqw;font-weight:700}
#prenom{left:51%;top:33.1%;font-size:5.1cqw;font-weight:500}
#nom{left:51%;top:38.5%;font-size:5.1cqw;font-weight:600;text-transform:uppercase}
#poste{left:54.5%;top:44.1%;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:3.75cqw}
#msg{left:10.2%;top:78%;width:42%;font-size:1.78cqw;line-height:2cqw}
#url{left:0;width:51.5%;top:96%;text-align:center;font-weight:700;font-size:2.2cqw}
.frame{left:2.5%;top:19.4%;width:48.8%;height:55.5%;background:#fff;transform:rotate(-3.6deg);box-shadow:0 .6cqw 2cqw rgba(0,0,0,.18)}
.frame .ph{position:absolute;left:9.5%;top:6%;width:79.5%;height:85%;overflow:hidden;background:#d8d8d8}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.clogo{left:4.3%;top:3.4%;width:12.7%;height:12.7%;object-fit:contain}
.date{left:2.5%;top:59.2%;width:18.6%;aspect-ratio:1;border-radius:50%;background:#f0c919;color:#7a1f10;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;font-size:3cqw;line-height:1.2;padding:2cqw}
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="login">
  <form class="lbox" id="lform">
    <img class="logoimg llogo" alt="Logo">
    <h1>Caisse Populaire <b>SUCCES</b></h1>
    <p style="color:var(--mut);font-size:.9rem">Gestion des cartes d’anniversaire</p>
    <label>Utilisateur<input id="lu" autocomplete="username" required></label>
    <label>Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr"></div>
    <button class="btn" type="submit">Se connecter</button>
  </form>
</section>

<!-- ============ APPLICATION ============ -->
<div id="app" hidden>
  <header>
    <div class="hl"><button class="logobtn" id="logobtn" title="Changer le logo" aria-label="Changer le logo"><img class="logoimg" alt="Logo"></button><h1>Caisse Populaire <b>SUCCES</b></h1></div>
    <div class="hr"><button class="btn alt bell" id="bell" aria-label="Notifications">🔔<b id="bn" hidden>0</b></button><button class="btn sm" id="install" hidden>Installer</button><button class="btn alt sm" id="logout">Quitter</button></div>
  </header>
  <main>
    <div class="banner" id="banner" hidden></div>
    <div class="tools">
      <input class="s" id="q" type="search" placeholder="Rechercher un nom, un poste…" aria-label="Rechercher">
      <select id="fm" aria-label="Filtrer par mois"></select>
      <select id="fp" aria-label="Filtrer par poste"></select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
  </main>
  <button class="btn fab" id="add">+ Ajouter</button>
</div>

<!-- Formulaire ajout / modification -->
<div class="modal" id="mform" hidden>
  <form class="sheet" id="pform">
    <h2 id="ftitle">Ajouter</h2>
    <div class="pv"><img id="fimg" alt=""><label style="flex:1">Photo<input type="file" id="ffile" accept="image/*"></label></div>
    <div class="g2">
      <label>Prénom<input id="fprenom" required></label>
      <label>Nom<input id="fnom" required></label>
    </div>
    <label>Poste<input id="fposte" required></label>
    <div class="g2">
      <label>Genre<select id="fgenre"><option value="Née">Née (femme)</option><option value="Né">Né (homme)</option></select></label>
      <label>Jour<input id="fjour" type="number" min="1" max="31" required></label>
    </div>
    <label>Mois<select id="fmois"></select></label>
    <div class="bar"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn" type="submit">Enregistrer</button></div>
  </form>
</div>

<!-- Notifications -->
<div class="modal" id="mnotif" hidden>
  <div class="sheet">
    <h2>🔔 Anniversaires proches (7 jours)</h2>
    <div class="nlist" id="nlist"></div>
    <div class="bar"><button class="btn alt" id="perm">Activer les notifications du navigateur</button><button class="btn" data-close>Fermer</button></div>
    <small style="color:var(--mut)" id="permnote"></small>
  </div>
</div>

<!-- Logo -->
<div class="modal" id="mlogo" hidden>
  <div class="sheet">
    <h2>Logo de la Caisse</h2>
    <div class="lp"><img class="logoimg" style="border-radius:0" alt="Logo actuel"></div>
    <label>Nouvelle image (PNG recommandé)<input type="file" id="lfile" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
    <div class="bar"><button class="btn del" id="lreset">Rétablir le logo par défaut</button><button class="btn" data-close>Fermer</button></div>
  </div>
</div>

<!-- Aperçu de la carte -->
<div class="modal" id="mview" hidden>
  <div class="sheet">
    <div id="cardbox"></div>
    <div class="bar"><button class="btn alt" data-close>Fermer</button><button class="btn" id="dl">Télécharger en PNG</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ---- Identifiants (à modifier ici). Attention : protection côté navigateur uniquement. ---- */
const USER = 'admin', PASS = 'succes2026';

const $ = id => document.getElementById(id);
/* ---- Logo ---- */
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220"><defs><path id="arc" d="M 92 160 A 80 80 0 1 1 252 160"/></defs><g transform="translate(-62 -50)"><circle cx="172" cy="160" r="103" fill="#fff" stroke="#f0a500" stroke-width="9"/><circle cx="172" cy="160" r="82" fill="none" stroke="#2d7d1f" stroke-width="2"/><text font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#1b5e20"><textPath href="#arc" startOffset="2">SUCCÈS, CAISSE POPULAIRE</textPath></text><path fill="#1b8a2e" d="M135 195V155h-14l27-40 27 40h-14v40zM178 195V150h-14l27-42 27 42h-14v45z"/><path d="M118 190C200 205 235 175 195 150S130 130 215 120" fill="none" stroke="#f0a500" stroke-width="8" stroke-linecap="round"/></g></svg>`;
const LOGO_DEFAULT = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG);
let logo = LOGO_DEFAULT;
try { logo = localStorage.getItem('succes_logo') || LOGO_DEFAULT; } catch(e){}
const applyLogo = () => document.querySelectorAll('img.logoimg').forEach(i => i.src = logo);
applyLogo();
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const PLACEHOLDER = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Crect width='100' height='120' fill='%23dcdcdc'/%3E%3Ccircle cx='50' cy='46' r='22' fill='%23aaa'/%3E%3Cpath d='M8 120c0-34 20-48 42-48s42 14 42 48z' fill='%23aaa'/%3E%3C/svg%3E";

/* ---- Stockage ---- */
let data = [];
try { data = JSON.parse(localStorage.getItem('succes_fetes') || 'null') || []; } catch(e){}
if (!data.length && !localStorage.getItem('succes_init')) {
  data = [{id:1,prenom:'Liliane-Ursule',nom:'SOLIMAN',poste:'Assistante du portefeuille',genre:'Née',jour:21,mois:9,photo:''}];
}
const save = () => { try { localStorage.setItem('succes_fetes', JSON.stringify(data)); localStorage.setItem('succes_init','1'); } catch(e){ alert('Stockage plein : utilisez des photos plus légères.'); } };

$('logobtn').onclick = () => $('mlogo').hidden = false;
$('lfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, 500 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s) || 300; c.height = Math.round(img.height * s) || 300;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    logo = c.toDataURL('image/png');                 // PNG : la transparence est conservée
    try { localStorage.setItem('succes_logo', logo); } catch(e){ alert('Logo trop lourd pour le stockage.'); }
    applyLogo(); e.target.value = ''; };
    img.src = r.result; };
  r.readAsDataURL(f);
};
$('lreset').onclick = () => { logo = LOGO_DEFAULT; try { localStorage.removeItem('succes_logo'); } catch(e){} applyLogo(); };

/* ---- Connexion ---- */
const open = () => { $('login').hidden = true; $('app').hidden = false; render(); pushNotifs(); };
$('lform').onsubmit = e => {
  e.preventDefault();
  if ($('lu').value.trim() === USER && $('lp').value === PASS) { sessionStorage.setItem('succes_ok','1'); $('lerr').textContent=''; open(); }
  else $('lerr').textContent = 'Utilisateur ou mot de passe incorrect.';
};
$('logout').onclick = () => { sessionStorage.removeItem('succes_ok'); $('app').hidden = true; $('login').hidden = false; $('lp').value=''; };

/* ---- Liste, recherche, filtres ---- */
$('fm').innerHTML = '<option value="">Tous les mois</option>' + MOIS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
$('fmois').innerHTML = MOIS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
let onlySoon = false;

const daysLeft = p => {
  const t = new Date(); t.setHours(0,0,0,0);
  let d = new Date(t.getFullYear(), p.mois, p.jour);
  if (d < t) d = new Date(t.getFullYear()+1, p.mois, p.jour);
  return Math.round((d - t) / 864e5);
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const cur = $('fp').value;
  const postes = [...new Set(data.map(p => p.poste))].sort();
  $('fp').innerHTML = '<option value="">Tous les postes</option>' + postes.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  const q = $('q').value.toLowerCase().trim(), m = $('fm').value, po = $('fp').value;
  const rows = data
    .filter(p => (!q || `${p.prenom} ${p.nom} ${p.poste}`.toLowerCase().includes(q)) && (m === '' || p.mois == m) && (!po || p.poste === po) && (!onlySoon || daysLeft(p) <= 30))
    .sort((a,b) => daysLeft(a) - daysLeft(b));
  const soon = data.filter(p => daysLeft(p) <= 30).length;
  $('stats').innerHTML = `<span>${rows.length} / ${data.length} personne(s)</span><span class="chip${onlySoon?' on':''}" id="soon" role="button" tabindex="0">Dans les 30 jours (${soon})</span>`;
  updateBell();
  $('soon').onclick = () => { onlySoon = !onlySoon; render(); };
  $('list').innerHTML = rows.length ? rows.map(p => {
    const d = daysLeft(p);
    const b = d === 0 ? '<span class="badge">Aujourd’hui</span>' : d <= 30 ? `<span class="badge">dans ${d} j</span>` : '';
    return `<div class="item"><img src="${p.photo || PLACEHOLDER}" alt="">
      <div><div class="nm">${esc(p.prenom)} ${esc(p.nom.toUpperCase())}<small>${esc(p.poste)}</small></div>
      <div class="dt">${p.genre} le ${p.jour} ${MOIS[p.mois]}${b}</div></div>
      <div class="acts"><button class="btn sm" data-v="${p.id}">Voir</button><button class="btn alt sm" data-e="${p.id}">Modifier</button><button class="btn del sm" data-d="${p.id}">Supprimer</button></div></div>`;
  }).join('') : '<div class="empty">Aucun résultat.</div>';
}
['q','fm','fp'].forEach(id => $(id).addEventListener('input', render));
$('list').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = +(b.dataset.v || b.dataset.e || b.dataset.d), p = data.find(x => x.id === id);
  if (b.dataset.v) view(p);
  else if (b.dataset.e) form(p);
  else if (b.dataset.d && confirm(`Supprimer ${p.prenom} ${p.nom} ?`)) { data = data.filter(x => x.id !== id); save(); render(); }
};

/* ---- Notifications ---- */
const SOON = 7;
const when = d => d === 0 ? 'Aujourd’hui' : d === 1 ? 'Demain' : `Dans ${d} jours`;
const near = () => data.filter(p => daysLeft(p) <= SOON).sort((a,b) => daysLeft(a) - daysLeft(b));
function updateBell() {
  const l = near(); $('bn').textContent = l.length; $('bn').hidden = !l.length;
  const t = l.filter(p => daysLeft(p) === 0);
  $('banner').hidden = !t.length;
  $('banner').textContent = t.length ? '🎂 Aujourd’hui : ' + t.map(p => `${p.prenom} ${p.nom}`).join(', ') : '';
}
function show(t, o) {   // via le service worker (obligatoire sur Android), sinon notification classique
  o = {icon: 'icon-192.png', badge: 'icon-192.png', ...o};
  const fb = () => { try { new Notification(t, o); } catch(e){} };
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(t, o) : fb()).catch(fb); else fb();
}
function pushNotifs() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const key = new Date().toDateString();
  try { if (localStorage.getItem('succes_notif') === key) return; } catch(e){}
  const l = near().filter(p => daysLeft(p) <= 1); if (!l.length) return;
  try { localStorage.setItem('succes_notif', key); } catch(e){}
  l.forEach(p => show('🎂 Anniversaire ' + when(daysLeft(p)).toLowerCase(), {body: `${p.prenom} ${p.nom} – ${p.poste}`}));
}
$('bell').onclick = () => {
  const l = near();
  $('nlist').innerHTML = l.length ? l.map(p => `<div class="nit${daysLeft(p) === 0 ? ' today' : ''}"><img src="${p.photo || PLACEHOLDER}" alt="">
    <div class="nm">${esc(p.prenom)} ${esc(p.nom.toUpperCase())}<small>${when(daysLeft(p))} · ${p.jour} ${MOIS[p.mois]}</small></div>
    <button class="btn sm" data-nv="${p.id}">Voir</button></div>`).join('') : '<div class="empty">Aucun anniversaire dans les 7 prochains jours.</div>';
  $('permnote').textContent = !('Notification' in window) ? 'Notifications du navigateur non prises en charge.'
    : Notification.permission === 'granted' ? 'Notifications du navigateur activées (rappel à l’ouverture de l’application).'
    : Notification.permission === 'denied' ? 'Notifications bloquées dans les réglages du navigateur.' : '';
  $('perm').hidden = !('Notification' in window) || Notification.permission !== 'default';
  $('mnotif').hidden = false;
};
$('nlist').onclick = e => { const b = e.target.closest('[data-nv]'); if (b) { $('mnotif').hidden = true; view(data.find(x => x.id === +b.dataset.nv)); } };
$('perm').onclick = async () => { await Notification.requestPermission(); pushNotifs(); $('bell').click(); };

/* ---- Formulaire ---- */
let editId = null, photo = '';
function form(p) {
  editId = p ? p.id : null; photo = p ? p.photo : '';
  $('ftitle').textContent = p ? 'Modifier' : 'Ajouter';
  $('fprenom').value = p?.prenom || ''; $('fnom').value = p?.nom || ''; $('fposte').value = p?.poste || '';
  $('fgenre').value = p?.genre || 'Née'; $('fjour').value = p?.jour || ''; $('fmois').value = p ? p.mois : new Date().getMonth();
  $('fimg').src = photo || PLACEHOLDER; $('ffile').value = '';
  $('mform').hidden = false;
}
$('add').onclick = () => form(null);
$('ffile').onchange = e => {                       // redimensionne la photo pour économiser l'espace
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), r = new FileReader();
  r.onload = () => { img.onload = () => {
    const s = Math.min(1, 700 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photo = c.toDataURL('image/jpeg', .85); $('fimg').src = photo; };
    img.src = r.result; };
  r.readAsDataURL(f);
};
$('pform').onsubmit = e => {
  e.preventDefault();
  const p = {prenom:$('fprenom').value.trim(), nom:$('fnom').value.trim(), poste:$('fposte').value.trim(),
    genre:$('fgenre').value, jour:Math.min(31, Math.max(1, +$('fjour').value)), mois:+$('fmois').value, photo};
  if (editId) Object.assign(data.find(x => x.id === editId), p);
  else data.push({id: Date.now(), ...p});
  save(); $('mform').hidden = true; render();
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').hidden = true);
document.querySelectorAll('.modal').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.hidden = true; }));

function view(p) {
  $('cardbox').innerHTML = `<div id="card">${DECOR}<img class="clogo" src="${logo}" alt="">
  <div class="frame"><div class="ph"><img src="${p.photo || PLACEHOLDER}" alt=""></div></div>
  <div class="date">${p.genre} un ${p.jour} ${MOIS[p.mois]}</div>
  <div class="t" id="t1">Caisse Populaire</div><div class="t" id="t2">SUCCES</div>
  <div class="t" id="joyeux">JOYEUX</div><div class="t" id="anniv">Anniversaire</div>
  <div class="t" id="prenom">${esc(p.prenom)}</div><div class="t" id="nom">${esc(p.nom)}</div><div class="t" id="poste">${esc(p.poste)}</div>
  <p id="msg">En votre honneur, l’administration de la Caisse Populaire SUCCÈS exprime sa reconnaissance et ses souhaits les meilleurs.<br>Votre contribution participe chaque jour à notre mission collective. Que cette nouvelle année personnelle soit source de joies et d’accomplissements. Le succès continu!</p>
  <div id="url">www.succes.coop</div></div>`;
  $('dl').onclick = async () => {
    const el = $('card'); try { await document.fonts.ready; } catch(e){}
    const c = await html2canvas(el, {scale: 1614 / el.offsetWidth, backgroundColor: null});
    const a = document.createElement('a');
    a.download = `anniversaire-${p.prenom}-${p.nom}.png`.replace(/\s+/g,'-'); a.href = c.toDataURL('image/png'); a.click();
  };
  $('mview').hidden = false;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
